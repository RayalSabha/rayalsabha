name: Convert Images to WebP

on:
  push:
    branches:
      - main
    paths:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'

jobs:
  convert-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get install -y webp

      - name: Convert ALL PNG/JPG to WebP
        run: |
          find . -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            ! -path "./.git/*" | while read file; do
            filename="${file%.*}"
            webp_file="${filename}.webp"

            # Convert if WebP doesn't exist OR PNG is newer than WebP
            if [ ! -f "$webp_file" ] || [ "$file" -nt "$webp_file" ]; then
              cwebp -q 85 "$file" -o "$webp_file"
              echo "✅ Converted: $file → $webp_file"
            else
              echo "⏭️ Skipped (already exists): $webp_file"
            fi
          done

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add **/*.webp *.webp 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No new WebP files to commit."
          else
            git commit -m "Auto-convert images to WebP [skip ci]"
            git push
          fi
